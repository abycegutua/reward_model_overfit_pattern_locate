[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abycegutua-reward_model_overfit_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告多模态评测工程师·奖励模型的过拟合相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "abycegutua" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://abycegutua.github.io"
Repository = "https://github.com/abycegutua/reward_model_overfit_pattern_locate"
Issues = "https://github.com/abycegutua/reward_model_overfit_pattern_locate/issues"

[project.scripts]
reward_model_overfit_pattern_locate = "reward_model_overfit_pattern_locate:main"

[tool.setuptools]
py-modules = ["reward_model_overfit_pattern_locate"]
